
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>i-tu | Chess Club</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090909;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  padding: 35px 15px;
  background: linear-gradient(135deg, #202020, #080808);
  border-bottom: 1px solid #444;
}

.logo {
  font-size: 42px;
  font-weight: bold;
  letter-spacing: 5px;
}

.subtitle {
  color: #aaa;
  letter-spacing: 3px;
  font-size: 12px;
}

main {
  max-width: 650px;
  margin: auto;
  padding: 25px 18px;
}

h2 {
  color: #eee;
  letter-spacing: 2px;
}

.panel {
  background: #151515;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 22px;
  margin: 18px 0;
}

.button {
  display: block;
  padding: 14px;
  margin: 12px auto;
  max-width: 300px;
  border: 1px solid #888;
  border-radius: 8px;
  color: white;
  text-decoration: none;
  background: #222;
  transition: 0.2s;
}

.button:hover {
  background: #444;
  border-color: white;
  transform: scale(1.03);
}

.join {
  background: white;
  color: black;
  font-weight: bold;
}

.join:hover {
  background: #ccc;
}

.muted {
  color: #999;
  font-size: 13px;
}

footer {
  padding: 25px;
  color: #666;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">i-tu</div>
  <p class="subtitle">MORE THAN JUST CHESS</p>
</header>

<main>

  <section class="panel">
    <h2>WELCOME TO i-tu</h2>
    <p>A place for chess, friends, and unforgettable games.</p>
    <a class="button join"
       href="https://www.chess.com/club/i-tu/join"
       target="_blank">
       JOIN THE CLUB →
    </a>
  </section>

  <section class="panel">
    <h2>QUICK LINKS</h2>
    <a class="button" href="https://www.chess.com/club/i-tu">
      Club Homepage
    </a>
    <a class="button" href="https://www.chess.com/club/i-tu/members">
      Members
    </a>
    <a class="button" href="https://www.chess.com/club/i-tu/leaderboard">
      Leaderboard
    </a>
  </section>

  <section class="panel">
    <h2>THE COMMUNITY</h2>
    <p>Good games. Good people. Great chess.</p>
    <p class="muted">Welcome to i-tu.</p>
  </section>

</main>

<footer>
  i-tu Chess Club · Chess.com
</footer>

</body>
</html>
