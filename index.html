
<style>
html, body {
  margin: 0 !important;
  padding: 0 !important;
  background: #050505 !important;
  overflow-x: hidden;
}

#itu-theme {
  box-sizing: border-box;
  width: 100%;
  min-height: 100vh;
}
</style>

<div id="itu-theme" data-color="off" style="position:relative;background:#050505;color:#fff;padding:16px;border:1px solid #888;border-radius:14px;font-family:Arial,sans-serif;">

<style>
#itu-theme a[data-hover-button],
#itu-theme button[data-hover-button] {
  transition: transform .22s ease, box-shadow .22s ease, filter .22s ease, background .22s ease, border-color .22s ease;
}
#itu-theme a[data-hover-button]:hover,
#itu-theme button[data-hover-button]:hover {
  transform: translateY(-2px) scale(1.025);
  filter: brightness(1.25);
  box-shadow: 0 0 16px var(--hover-glow,#fff), 0 0 28px var(--hover-glow,#fff);
  border-color: var(--hover-border,#fff) !important;
}
#itu-theme a[data-hover-button]:active,
#itu-theme button[data-hover-button]:active {
  transform: scale(.99);
}
#itu-theme .itu-cat-rain {
  position:absolute;
  top:-40px;
  z-index:9999;
  pointer-events:none;
  animation:ituCatFall linear forwards;
  line-height:1;
}
@keyframes ituCatFall {
  0% { transform:translateY(-30px) rotate(0deg); opacity:0; }
  10% { opacity:1; }
  90% { opacity:1; }
  100% { transform:translateY(750px) rotate(360deg); opacity:0; }
}

/* PROFILE BOXES */
#itu-theme .hawk-profile {
  text-align:center;
  padding:20px 10px;
  margin-bottom:14px;
  border:1px solid #888;
  border-radius:12px;
  background:#111;
  position:relative;
  overflow:hidden;
  transition:all .25s ease;
}

#itu-theme .hawk-avatar-wrap {
  width:112px;
  height:112px;
  margin:16px auto;
  border-radius:50%;
  padding:4px;
  background:#555;
  box-shadow:0 0 10px #fff;
  transition:transform .25s ease,box-shadow .25s ease,filter .25s ease;
  cursor:pointer;
}

#itu-theme .hawk-avatar-wrap:hover {
  transform:scale(1.09);
  filter:brightness(1.2);
  box-shadow:0 0 16px var(--avatar-glow,#fff),
             0 0 28px var(--avatar-glow,#fff),
             0 0 45px var(--avatar-glow,#fff);
}

#itu-theme .hawk-avatar-inner {
  width:100%;
  height:100%;
  border-radius:50%;
  background:#171717;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:42px;
  font-weight:900;
  color:#fff;
}

#itu-theme #hawk-live-avatar,
#itu-theme #watch-live-avatar {
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
}

#itu-theme .hawk-name {
  font-size:21px;
  font-weight:900;
  letter-spacing:3px;
  color:#fff;
  overflow-wrap:anywhere;
}

#itu-theme .hawk-owner-label {
  font-size:10px;
  letter-spacing:5px;
  color:#aaa;
  margin-bottom:8px;
}

#itu-theme .watch-label {
  font-size:10px;
  letter-spacing:4px;
  color:#aaa;
  margin-bottom:8px;
}
</style>

<!-- COLOR BUTTON -->
<button onclick="
var b=document.getElementById('itu-theme');
var on=b.getAttribute('data-color')!=='on';
b.setAttribute('data-color',on?'on':'off');
b.style.background=on?'#100a24':'#050505';
b.style.borderColor=on?'#a855f7':'#888';
b.style.boxShadow=on?'0 0 22px #7c3aed':'none';

b.querySelectorAll('[data-color-bg]').forEach(function(e){
e.style.background=on?e.getAttribute('data-color-bg'):e.getAttribute('data-bw-bg');
});

b.querySelectorAll('[data-color-border]').forEach(function(e){
e.style.borderColor=on?e.getAttribute('data-color-border'):'#888';
});

b.querySelectorAll('[data-color-text]').forEach(function(e){
e.style.color=on?e.getAttribute('data-color-text'):'#fff';
});

b.querySelectorAll('[data-color-shadow]').forEach(function(e){
e.style.textShadow=on?e.getAttribute('data-color-shadow'):'none';
});

b.querySelectorAll('[data-hover-button]').forEach(function(e){
e.style.setProperty('--hover-glow',on?e.getAttribute('data-hover-color'):'#fff');
e.style.setProperty('--hover-border',on?e.getAttribute('data-hover-border'):'#fff');
});

b.querySelectorAll('.hawk-avatar-wrap').forEach(function(ring){
ring.style.background=on?'linear-gradient(135deg,#00dfff,#8b5cf6,#00dfff)':'#555';
ring.style.setProperty('--avatar-glow',on?'#00dfff':'#fff');
ring.style.boxShadow=on?'0 0 18px #008cff,0 0 35px #5630a0':'0 0 10px #fff';
});

b.querySelectorAll('.hawk-profile').forEach(function(profile){
profile.style.background=on?'linear-gradient(145deg,#101820,#101020,#080808)':'#111';
profile.style.borderColor=on?'#8b5cf6':'#888';
});

this.innerHTML=on?'◼ BLACK &amp; WHITE':'✦ TURN ON COLOR';
this.style.background=on?'#111':'linear-gradient(90deg,#287bff,#8b5cf6)';
this.style.color='#fff';
" style="display:block;width:100%;background:#111;color:#fff;border:1px solid #fff;border-radius:9px;padding:12px;margin-bottom:10px;font-weight:bold;letter-spacing:2px;cursor:pointer;transition:all .25s ease;">✦ TURN ON COLOR</button>

<!-- LOAD LIVE CHESS.COM AVATARS -->
<script>
(function(){

  function loadAvatar(username, imageId, fallbackId, letter){

    var avatar = document.getElementById(imageId);
    var fallback = document.getElementById(fallbackId);

    fetch('https://api.chess.com/pub/player/' + username)
      .then(function(response){
        if(!response.ok) throw new Error('Profile unavailable');
        return response.json();
      })
      .then(function(profile){

        if(profile.avatar){

          avatar.onload = function(){
            avatar.style.display = 'block';
            fallback.style.display = 'none';
          };

          avatar.onerror = function(){
            avatar.style.display = 'none';
            fallback.style.display = 'block';
          };

          avatar.src = profile.avatar;

        }

      })
      .catch(function(){
        fallback.textContent = letter;
      });

  }

  loadAvatar(
    'i-am-hawk',
    'hawk-live-avatar',
    'hawk-avatar-fallback',
    'H'
  );

  loadAvatar(
    'watchandlearn101',
    'watch-live-avatar',
    'watch-avatar-fallback',
    'W'
  );

})();
</script>
