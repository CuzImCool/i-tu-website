
<style>
html, body {
  margin:0!important;
  padding:0!important;
  background:#050505!important;
  overflow-x:hidden;
}
#itu-theme {
  box-sizing:border-box;
  width:100%;
  min-height:100vh;
}

/* HOVER EFFECTS */
#itu-theme a[data-hover-button],
#itu-theme button[data-hover-button] {
  transition:all .22s ease;
}
#itu-theme a[data-hover-button]:hover,
#itu-theme button[data-hover-button]:hover {
  transform:translateY(-2px) scale(1.025);
  filter:brightness(1.25);
  box-shadow:0 0 16px var(--hover-glow,#fff),
             0 0 28px var(--hover-glow,#fff);
  border-color:var(--hover-border,#fff)!important;
}
#itu-theme a[data-hover-button]:active,
#itu-theme button[data-hover-button]:active {
  transform:scale(.99);
}

/* CAT RAIN */
#itu-theme .itu-cat-rain {
  position:absolute;
  top:-40px;
  z-index:9999;
  pointer-events:none;
  animation:ituCatFall linear forwards;
  line-height:1;
}
@keyframes ituCatFall {
  0% {transform:translateY(-30px) rotate(0);opacity:0}
  10% {opacity:1}
  90% {opacity:1}
  100% {transform:translateY(750px) rotate(360deg);opacity:0}
}

/* OWNER CARD */
#itu-theme .hawk-profile {
  text-align:center;
  padding:11px 8px;
  margin-bottom:12px;
  border:1px solid #888;
  border-radius:10px;
  background:#111;
  position:relative;
  overflow:hidden;
  transition:all .25s ease;
}
#itu-theme .hawk-avatar-wrap {
  width:78px;
  height:78px;
  margin:9px auto;
  border-radius:50%;
  padding:3px;
  background:#555;
  box-shadow:0 0 9px #fff;
  transition:all .25s ease;
  cursor:pointer;
}
#itu-theme .hawk-avatar-wrap:hover {
  transform:scale(1.09);
  filter:brightness(1.2);
  box-shadow:0 0 16px var(--avatar-glow,#fff),
             0 0 28px var(--avatar-glow,#fff),
             0 0 45px var(--avatar-glow,#fff);
}
#itu-theme .hawk-avatar-inner {
  width:100%;
  height:100%;
  border-radius:50%;
  background:#171717;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:34px;
  font-weight:900;
  color:#fff;
}
#itu-theme #hawk-live-avatar {
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
}
#itu-theme .hawk-name {
  font-size:18px;
  font-weight:900;
  letter-spacing:2px;
  color:#fff;
  overflow-wrap:anywhere;
}
#itu-theme .hawk-owner-label {
  font-size:9px;
  letter-spacing:4px;
  color:#aaa;
  margin-bottom:5px;
}

/* WATCHANDLEARN101 CARD */
#itu-theme .watch-profile {
  display:flex;
  align-items:center;
  gap:13px;
  padding:12px;
  margin-bottom:14px;
  border:1px solid #888;
  border-left:5px solid #777;
  border-radius:0 9px 9px 0;
  background:#111;
  min-height:88px;
  box-sizing:border-box;
  transition:all .25s ease;
}
#itu-theme .watch-avatar-wrap {
  width:68px;
  height:68px;
  min-width:68px;
  border-radius:9px;
  padding:2px;
  background:#555;
  box-shadow:0 0 8px #fff;
  box-sizing:border-box;
  transition:all .25s ease;
  cursor:pointer;
}
#itu-theme .watch-avatar-wrap:hover {
  transform:scale(1.08);
  filter:brightness(1.2);
  box-shadow:0 0 14px var(--avatar-glow,#fff),
             0 0 26px var(--avatar-glow,#fff),
             0 0 38px var(--avatar-glow,#fff);
}
#itu-theme .watch-avatar-inner {
  width:100%;
  height:100%;
  border-radius:7px;
  background:#171717;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:30px;
  font-weight:900;
  color:#fff;
}
#itu-theme #watch-live-avatar {
  display:none;
  width:100%;
  height:100%;
  object-fit:cover;
}
#itu-theme .watch-info {
  min-width:0;
  text-align:left;
}
#itu-theme .watch-name {
  font-size:19px;
  font-weight:900;
  color:#fff;
  overflow-wrap:anywhere;
  line-height:1.2;
  margin-bottom:5px;
}
#itu-theme .watch-rating {
  font-size:15px;
  font-weight:900;
  color:#35c5ff;
}

/* CLICKABLE PROFILE NAMES */
#itu-theme .profile-name-link {
  display:inline-block;
  color:inherit;
  text-decoration:none;
  cursor:pointer;
}
#itu-theme .profile-name-link:hover {
  filter:brightness(1.35);
}
</style>

<button onclick="

b.style.borderColor=on?'#a855f7':'#888';
b.style.boxShadow=on?'0 0 22px #7c3aed':'none';

});
b.querySelectorAll('[data-color-border]').forEach(function(e){
e.style.borderColor=on?e.getAttribute('data-color-border'):'#888';
});
b.querySelectorAll('[data-color-text]').forEach(function(e){
e.style.color=on?e.getAttribute('data-color-text'):'#fff';
});
b.querySelectorAll('[data-color-shadow]').forEach(function(e){
e.style.textShadow=on?e.getAttribute('data-color-shadow'):'none';
});
b.querySelectorAll('[data-hover-button]').forEach(function(e){
e.style.setProperty('--hover-glow',on?e.getAttribute('data-hover-color'):'#fff');
e.style.setProperty('--hover-border',on?e.getAttribute('data-hover-border'):'#fff');
});

b.querySelectorAll('.hawk-avatar-wrap,.watch-avatar-wrap').forEach(function(r){
r.style.background=on?'linear-gradient(135deg,#00dfff,#8b5cf6,#00dfff)':'#555';
r.style.setProperty('--avatar-glow',on?'#00dfff':'#fff');
r.style.boxShadow=on?'0 0 18px #008cff,0 0 35px #5630a0':'0 0 9px #fff';

b.querySelectorAll('.hawk-profile,.watch-profile').forEach(function(p){
p.style.background=on?'linear-gradient(145deg,#101820,#101020,#080808)':'#111';
p.style.borderColor=on?'#8b5cf6':'#888';

this.innerHTML=on?'◼ BLACK &amp; WHITE':'✦ TURN ON COLOR';
this.style.background=on?'#111':'linear-gradient(90deg,#287bff,#8b5cf6)';
this.style.color='#fff';
"

<!-- LOAD CHESS.COM PROFILES AND BLITZ RATING -->
<script>
(function(){

function loadAvatar(username,imageId,fallbackId,letter){
  var avatar=document.getElementById(imageId);
  var fallback=document.getElementById(fallbackId);

  fetch('https://api.chess.com/pub/player/'+username)
    .then(function(response){
      if(!response.ok) throw new Error('Profile unavailable');
      return response.json();
    })
    .then(function(profile){
      if(profile.avatar){
        avatar.onload=function(){
          avatar.style.display='block';
          fallback.style.display='none';
        };
        avatar.onerror=function(){
          avatar.style.display='none';
          fallback.style.display='block';
        };
        avatar.src=profile.avatar;
      }
    })
    .catch(function(){
      fallback.textContent=letter;
    });
}

loadAvatar('i-am-hawk','hawk-live-avatar','hawk-avatar-fallback','H');
loadAvatar('watchandlearn101','watch-live-avatar','watch-avatar-fallback','W');

/* FETCH LIVE BLITZ RATING */
fetch('https://api.chess.com/pub/player/watchandlearn101/stats')
  .then(function(response){
    if(!response.ok) throw new Error('Stats unavailable');
    return response.json();
  })
  .then(function(stats){
    var rating=document.getElementById('watch-blitz-rating');

    if(stats.chess_blitz && stats.chess_blitz.last &&
       stats.chess_blitz.last.rating){
      rating.textContent='Blitz: '+stats.chess_blitz.last.rating;
    } else {
      rating.textContent='Blitz: Unrated';
    }
  })
  .catch(function(){
    document.getElementById('watch-blitz-rating').textContent='Blitz: --';
  });

})();
</script>
