<!-- CHRISTMAS COLOR BUTTON -->
<button onclick="
var b=document.getElementById('itu-theme');
var on=b.getAttribute('data-color')!=='on';
b.setAttribute('data-color',on?'on':'off');

b.style.background=on?'linear-gradient(145deg,#071b10,#180609,#071b10)':'#050505';
b.style.borderColor=on?'#c9a64b':'#718092';
b.style.boxShadow=on?'0 0 18px #176b37,0 0 32px #8b1525':'inset 0 0 24px rgba(180,205,230,.045),0 0 20px rgba(190,215,240,.09)';

b.querySelectorAll('[data-color-bg]').forEach(function(e){
  e.style.background=on?e.getAttribute('data-color-bg'):e.getAttribute('data-bw-bg');
});

b.querySelectorAll('[data-color-border]').forEach(function(e){
  e.style.borderColor=on?e.getAttribute('data-color-border'):'#888';
});

b.querySelectorAll('[data-color-text]').forEach(function(e){
  e.style.color=on?e.getAttribute('data-color-text'):'#fff';
});

b.querySelectorAll('[data-color-shadow]').forEach(function(e){
  e.style.textShadow=on?e.getAttribute('data-color-shadow'):'none';
});

b.querySelectorAll('[data-hover-button]').forEach(function(e){
  e.style.setProperty('--hover-glow',on?e.getAttribute('data-hover-color'):'#fff');
  e.style.setProperty('--hover-border',on?e.getAttribute('data-hover-border'):'#fff');
});

b.querySelectorAll('.hawk-avatar-wrap,.watch-avatar-wrap').forEach(function(r){
  r.style.background=on?'linear-gradient(135deg,#d51d36,#087a3c,#d5ad45)':'#555';
  r.style.setProperty('--avatar-glow',on?'#28c76f':'#fff');
  r.style.boxShadow=on?'0 0 18px #087a3c,0 0 30px #b51c32':'0 0 9px #fff';
});

b.querySelectorAll('.hawk-profile,.watch-profile,.member-counter,.new-members-box').forEach(function(p){
  p.style.background=on?'linear-gradient(145deg,#102719,#210c12,#102719)':'#111';
  p.style.borderColor=on?'#c9a64b':'#777';
});

b.querySelectorAll('.watch-profile').forEach(function(p){
  p.style.borderLeftColor=on?'#c91f36':'#777';
});

b.querySelectorAll('.new-member-card').forEach(function(p){
  p.style.background=on?'linear-gradient(145deg,#153321,#291016)':'#191919';
  p.style.borderColor=on?'#8b743d':'#444';
});

var number=b.querySelector('.member-number');
if(number){
  number.style.color=on?'#65e99a':'#fff';
  number.style.textShadow=on?'0 0 12px #087a3c,0 0 20px #b51c32':'0 0 12px #fff';
}

b.querySelectorAll('.member-dot').forEach(function(d){
  d.style.background=on?'#28c76f':'#888';
});

this.innerHTML=on?' CHRISTMAS MODE ON ':'✦ TURN ON COLOR';
this.style.background=on?'linear-gradient(90deg,#a9142b,#087a3c,#a9142b)':'#111';
this.style.color='#fff';
this.style.borderColor=on?'#d5ad45':'#fff';
"

<button data-hover-button data-hover-color="#bdeaff" data-hover-border="#ffffff"
onclick="
var box=document.getElementById('itu-theme');
var snow=['⭐️','⛄️','🎁'];
for(var i=0;i<32;i++){
  (function(){
    var flake=document.createElement('span');
    flake.className='itu-cat-rain';
    flake.textContent=snow[Math.floor(Math.random()*snow.length)];
    flake.style.left=(Math.random()*92)+'%';
    flake.style.fontSize=(18+Math.random()*20)+'px';
    flake.style.animationDuration=(2.5+Math.random()*2.5)+'s';
    flake.style.animationDelay=(Math.random()*1.8)+'s';
    box.appendChild(flake);
    setTimeout(function(){flake.remove()},7500);
  })();
}
"

<script>
(function(){

/* SNOWMAN CURSOR THAT FOLLOWS THE MOUSE */
var snowmanCursor=document.createElement('span');
snowmanCursor.id='itu-snowman-cursor';
snowmanCursor.textContent='⛄️';
document.body.appendChild(snowmanCursor);

var theme=document.getElementById('itu-theme');

document.addEventListener('mousemove',function(e){
  if(theme && theme.contains(e.target)){
    snowmanCursor.style.display='block';
    snowmanCursor.style.left=e.clientX+'px';
    snowmanCursor.style.top=e.clientY+'px';
  } else {
    snowmanCursor.style.display='none';
  }
});

/* SNOW TRAIL */
var lastSnow=0;

document.addEventListener('mousemove',function(e){
  var now=Date.now();
  if(now-lastSnow<35) return;
  lastSnow=now;

  var snow=document.createElement('span');
  snow.className='snow-trail';
  snow.textContent=Math.random()>.5?'❄️':'❄';

  snow.style.left=e.clientX+'px';
  snow.style.top=e.clientY+'px';
  snow.style.fontSize=(8+Math.random()*10)+'px';
  snow.style.setProperty('--snow-x',(-15+Math.random()*30)+'px');
  snow.style.setProperty('--snow-y',(15+Math.random()*25)+'px');

  document.body.appendChild(snow);
  setTimeout(function(){snow.remove()},900);
});

/* LOAD PROFILE PICTURES */
function loadAvatar(username,imageId,fallbackId,letter){
  var avatar=document.getElementById(imageId);
  var fallback=document.getElementById(fallbackId);

  fetch('https://api.chess.com/pub/player/'+username)
    .then(function(response){
      if(!response.ok) throw new Error('Profile unavailable');
      return response.json();
    })
    .then(function(profile){
      if(profile.avatar){
        avatar.onload=function(){
          avatar.style.display='block';
          fallback.style.display='none';
        };
        avatar.onerror=function(){
          avatar.style.display='none';
          fallback.style.display='block';
        };
        avatar.src=profile.avatar;
      }
    })
    .catch(function(){fallback.textContent=letter;});
}

/* LOAD MEMBER COUNT */
function loadMemberCount(){
  var count=document.getElementById('itu-member-count');
  var status=document.getElementById('itu-member-status');
  var dot=document.getElementById('itu-member-dot');

  fetch('https://api.chess.com/pub/club/i-tu')
    .then(function(response){
      if(!response.ok) throw new Error('Club data unavailable');
      return response.json();
    })
    .then(function(club){
      if(typeof club.members_count==='number'){
        count.textContent=club.members_count.toLocaleString();
        status.textContent='Club count loaded';
        dot.style.background='#35d66f';
        dot.style.boxShadow='0 0 8px #35d66f';
      } else {
        throw new Error('Member count unavailable');
      }
    })
    .catch(function(){
      count.textContent='--';
      status.textContent='Member count unavailable';
      dot.style.background='#ff5555';
      dot.style.boxShadow='0 0 8px #ff5555';
    });
}

/* TURN JOIN DATE INTO TIME AGO */
function timeAgo(timestamp){
  var seconds=Math.max(0,Math.floor(Date.now()/1000-timestamp));

  if(seconds<60){
    return 'JUST NOW';
  }

  var minutes=Math.floor(seconds/60);
  if(minutes<60){
    return minutes+' MINUTE'+(minutes===1?'':'S')+' AGO';
  }

  var hours=Math.floor(minutes/60);
  if(hours<24){
    return hours+' HOUR'+(hours===1?'':'S')+' AGO';
  }

  var days=Math.floor(hours/24);
  if(days<7){
    return days+' DAY'+(days===1?'':'S')+' AGO';
  }

  var weeks=Math.floor(days/7);
  if(days<30){
    return weeks+' WEEK'+(weeks===1?'':'S')+' AGO';
  }

  var months=Math.floor(days/30);
  if(days<365){
    return months+' MONTH'+(months===1?'':'S')+' AGO';
  }

  var years=Math.floor(days/365);
  return years+' YEAR'+(years===1?'':'S')+' AGO';
}

/* NEWEST MEMBERS */
function loadNewestMembers(){

  var container=document.getElementById('itu-new-members');
  var status=document.getElementById('itu-new-members-status');

  fetch('https://api.chess.com/pub/club/i-tu/members')
    .then(function(response){
      if(!response.ok) throw new Error('Member list unavailable');
      return response.json();
    })
    .then(function(data){

      var members=[];

      ['weekly','monthly','all_time'].forEach(function(group){
        if(Array.isArray(data[group])){
          data[group].forEach(function(member){
            if(member.username && typeof member.joined==='number'){
              members.push(member);
            }
          });
        }
      });

      /* SORT BY JOIN DATE */
      members.sort(function(a,b){
        return b.joined-a.joined;
      });

      /* REMOVE DUPLICATES */
      var seen={};
      members=members.filter(function(member){
        var key=member.username.toLowerCase();
        if(seen[key]) return false;
        seen[key]=true;
        return true;
      });

      /* SHOW THREE NEWEST */
      var newest=members.slice(0,3);

      container.innerHTML='';

      if(newest.length===0){
        container.innerHTML='<div class="new-members-status">No member data available.</div>';
        status.textContent='';
        return;
      }

      newest.forEach(function(member,index){

        var card=document.createElement('div');
        card.className='new-member-card';

        var avatarBox=document.createElement('div');
        avatarBox.className='new-member-avatar';
        avatarBox.textContent=member.username.charAt(0).toUpperCase();

        var info=document.createElement('div');
        info.className='new-member-info';

        var nameLink=document.createElement('a');
        nameLink.href='https://www.chess.com/member/'+encodeURIComponent(member.username);
        nameLink.target='_blank';
        nameLink.rel='noopener noreferrer';
        nameLink.className='profile-name-link';

        var name=document.createElement('div');
        name.className='new-member-name';
        name.textContent='@'+member.username;

        nameLink.appendChild(name);

        var date=document.createElement('div');
        date.className='new-member-date';
        date.textContent='JOINED '+timeAgo(member.joined);

        info.appendChild(nameLink);
        info.appendChild(date);

        var rank=document.createElement('div');
        rank.className='new-member-rank';
        rank.textContent='#'+(index+1);

        card.appendChild(avatarBox);
        card.appendChild(info);
        card.appendChild(rank);

        container.appendChild(card);

        /* LOAD MEMBER AVATAR */
        fetch('https://api.chess.com/pub/player/'+encodeURIComponent(member.username))
          .then(function(response){
            if(!response.ok) throw new Error('Avatar unavailable');
            return response.json();
          })
          .then(function(profile){
            if(profile.avatar){
              var img=document.createElement('img');
              img.alt=member.username;
              img.src=profile.avatar;
              img.onerror=function(){
                avatarBox.textContent=member.username.charAt(0).toUpperCase();
              };
              avatarBox.textContent='';
              avatarBox.appendChild(img);
            }
          })
          .catch(function(){});
      });

      status.textContent='THE 3 MOST RECENTLY JOINED MEMBERS';
    })
    .catch(function(){
      container.innerHTML='<div class="new-members-status">Could not load members right now.</div>';
      status.textContent='Chess.com API unavailable';
    });
}

/* INITIAL LOAD */
loadMemberCount();
loadNewestMembers();

/* REFRESH EVERY 5 MINUTES */
setInterval(loadMemberCount,300000);
setInterval(loadNewestMembers,300000);

})();
</script>
